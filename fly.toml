app = "ut-bot-top100"          # Your app name
primary_region = "cdg"         # Your region from logs

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/python"]

[processes]
  worker = "python main.py"

[[vm]]
  cpu_kind = "shared"          # Shared CPU (1 core max for free)
  cpus = 1                     # Explicitly 1 core
  memory_mb = 256

# No services – pure background worker
