app = "ut-bot-top100"        # ← CHANGE THIS TO YOUR EXACT FLY.IO APP NAME
primary_region = "cdg"       # ← Change only if your logs show a different region

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[processes]
  bot = "python main.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
