app = "ut-bot-top100"          # ← YOUR APP NAME (from Fly.io URL)
primary_region = "cdg"         # ← YOUR REGION (from logs, e.g., "cdg")

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/python"]

[processes]
  worker = "python main.py"    # ← Defines your bot as the "worker" process

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# No [services] or [http_service] – this is a pure background worker
